name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment from the latest stable release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine version and update manifest
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          latest = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/latest", "--jq", ".tag_name"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)", latest)
          if not match:
              raise SystemExit(f"Latest release tag {latest!r} is not a stable semantic version")

          major, minor, patch = map(int, match.groups())
          bump = os.environ["RELEASE_BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              raise SystemExit(f"Unsupported version bump: {bump}")

          version = f"{major}.{minor}.{patch}"
          manifest_path = Path("custom_components/blink_live_events/manifest.json")
          manifest_text = manifest_path.read_text(encoding="utf-8")
          manifest = json.loads(manifest_text)
          current = manifest.get("version", "")
          current_match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", current)
          if not current_match:
              raise SystemExit(f"Manifest version {current!r} is not a stable semantic version")
          current_version = tuple(map(int, current_match.groups()))
          target_version = (major, minor, patch)
          if current_version > target_version:
              raise SystemExit(
                  f"Manifest version {current} is newer than the next release {version}; "
                  "reconcile the manifest and latest release first"
              )

          updated_text, count = re.subn(
              r'("version"\s*:\s*)"[^"]+"',
              rf'\g<1>"{version}"',
              manifest_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update the manifest version")
          manifest_path.write_text(updated_text, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
          print(f"Preparing stable release v{version} (manifest was {current})")
          PY

      - name: Set up Python for receiver tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run receiver tests
        run: |
          python -m pip install -r receiver/requirements.txt
          python -m unittest discover -s receiver/tests -v

      - name: Set up Python for Home Assistant tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run Home Assistant tests
        run: |
          python -m pip install -r requirements_test.txt
          pytest -q

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Commit manifest version to main
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/blink_live_events/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare release ${RELEASE_TAG}"
            git push origin HEAD:main
          fi

      - name: Capture release commit
        id: release_commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish stable Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: receiver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/coreyhayward/ha-blink-live-events:${{ steps.version.outputs.tag }}
            ghcr.io/coreyhayward/ha-blink-live-events:latest
            ghcr.io/coreyhayward/ha-blink-live-events:sha-${{ steps.release_commit.outputs.sha }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --title "$RELEASE_TAG" --generate-notes
