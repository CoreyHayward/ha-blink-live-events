services:
  blink-push-receiver:
    image: ghcr.io/coreyhayward/blink-push-receiver:${BLINK_PUSH_IMAGE_TAG:-latest}
    container_name: blink-push-receiver
    command: ["listen"]
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - path: ../.env
        required: false
    environment:
      BLINK_PUSH_DATA_DIR: /data
    volumes:
      - blink-push-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  blink-push-data:
