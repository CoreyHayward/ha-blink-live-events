services:
  blink-live-events:
    image: ghcr.io/coreyhayward/ha-blink-live-events:${BLINK_LIVE_EVENTS_IMAGE_TAG:-latest}
    container_name: blink-live-events
    command: ["listen"]
    restart: unless-stopped
    init: true
    read_only: true
    env_file:
      - path: ../.env
        required: false
    environment:
      BLINK_LIVE_EVENTS_DATA_DIR: /data
    volumes:
      - blink-live-events-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  blink-live-events-data:
